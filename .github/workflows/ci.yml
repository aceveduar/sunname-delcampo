name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Corre contra una Supabase local levantada por Docker (ya viene
      # instalado en los runners de GitHub Actions) -- nunca contra el
      # proyecto real. Aplica todas las migraciones desde cero y luego
      # las pruebas pgTAP de supabase/tests/database/.
      - run: supabase start

      - run: supabase test db

  migration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Compara supabase/migrations contra el proyecto real (nunca las
      # aplica) -- si falta alguna, se olvidó correr `supabase db push`
      # a mano. Ya pasó una vez: el candado de cantidad de create_sale
      # (segunda auditoría, 2026-08-31) quedó sin aplicar 24 días porque
      # nada más que la memoria de quien programó lo recordaba, y las
      # pruebas de CI corren contra una base efímera, no contra esta.
      - name: Verificar migraciones pendientes en producción
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref pancbbjhhovxjnzyentb --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
          output=$(supabase db push --linked --password "${{ secrets.SUPABASE_DB_PASSWORD }}" --dry-run 2>&1)
          echo "$output"
          if ! echo "$output" | grep -q "up to date"; then
            echo "::error::Hay migraciones en supabase/migrations sin aplicar a producción. Corre 'supabase db push --linked' a mano antes de continuar."
            exit 1
          fi

  types-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # database.types.ts se escribe a mano con demasiada facilidad, y
      # tsc no puede detectar que quedó desactualizado: si ningún código
      # consulta todavía la tabla nueva, compila igual. Ya pasó --
      # product_price_history estuvo ausente del archivo un día entero sin
      # que nadie lo notara (CLAUDE.md §14.2). Esto lo compara contra el
      # esquema real de producción y falla si no coinciden.
      - name: Verificar que database.types.ts coincida con el esquema real
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase gen types typescript --project-id pancbbjhhovxjnzyentb > /tmp/types-real.ts
          if ! diff -u /tmp/types-real.ts apps/web/src/lib/database.types.ts; then
            echo "::error::database.types.ts no coincide con el esquema real de producción. Corre 'npx supabase gen types typescript --project-id pancbbjhhovxjnzyentb > apps/web/src/lib/database.types.ts' y commitea el resultado."
            exit 1
          fi

  deploy:
    needs: [check, db-tests, migration-check, types-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @sunname/web build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
